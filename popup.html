<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Colorbars</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="popup">
    <main class="popup-main">
      <div class="popup-head">
        <h1>Colorbars</h1>
      </div>

      <div class="popup-row">
        <div class="popup-text">
          <div class="popup-label">All sites</div>
          <div class="popup-sub">Show color bars on matching pages</div>
        </div>
        <input id="pp-global" class="switch" type="checkbox" />
      </div>

      <div class="popup-row" id="pp-page-row">
        <div class="popup-text">
          <div class="popup-label">This page</div>
          <div class="popup-sub" id="pp-page-sub">—</div>
        </div>
        <input id="pp-page" class="switch" type="checkbox" />
      </div>

      <div class="popup-row" id="pp-snooze-row" style="display: none">
        <div class="popup-text">
          <div class="popup-label">Snoozed</div>
          <div class="popup-sub" id="pp-snooze-sub">—</div>
        </div>
        <button id="pp-snooze-resume" type="button" class="secondary">Resume</button>
      </div>

      <!-- Quick "create rule from this page" (collapsed by default) -->
      <button id="pp-create-toggle" type="button" class="secondary popup-settings">
        Create rule for this page
      </button>

      <div class="popup-form" id="pp-panel" hidden>
        <!-- Shown when NO rule covers the page -->
        <div class="pp-group" id="pp-create-fields" hidden>
          <label>
            Rule name
            <input id="pp-name" type="text" autocomplete="off" />
          </label>
          <label>
            Bar text
            <input id="pp-text" type="text" autocomplete="off" placeholder="STAGING" />
            <span class="pp-error" id="pp-text-error" hidden>Enter bar text to create the rule.</span>
          </label>
          <div class="pp-field">
            <span class="pp-field-label">Color</span>
            <div class="pp-swatches" id="pp-swatches"></div>
          </div>
          <label class="inline">
            <input id="pp-wild" class="switch" type="checkbox" checked />
            Match all pages on this domain
          </label>
          <p class="hint pp-truncate" id="pp-pattern"></p>
        </div>

        <!-- Shown when a rule ALREADY covers the page -->
        <p class="hint pp-truncate" id="pp-exists-msg" hidden></p>

        <!-- Shown right after a rule is created -->
        <div class="pp-group" id="pp-done-block" hidden>
          <div class="pp-done-preview pp-truncate" id="pp-done-preview">TEXT</div>
          <p class="hint pp-truncate" id="pp-done-msg"></p>
        </div>
      </div>

      <button id="pp-action" type="button" class="popup-settings" hidden>Create rule</button>
      <button id="open-options" type="button" class="secondary popup-settings">Open Settings</button>
    </main>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
