<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Colorbars</title>
    <style>
      body {
        margin: 0;
        min-width: 220px;
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        padding: 12px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      button {
        width: 100%;
        border: 1px solid #d1d5db;
        background: #111827;
        color: #ffffff;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Colorbars</h1>
      <button id="open-options" type="button">Open Settings</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
